<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
  <div class="sm:flex sm:justify-between sm:items-center mb-8">
    <div class="mb-4 sm:mb-0">
      <h1 class="text-2xl md:text-3xl text-slate-800 font-bold">Org Config</h1>
      <p class="text-slate-500 text-sm mt-1">Advanced settings and features (JSON Editor)</p>
    </div>
  </div>

  <div class="bg-white shadow-lg rounded-sm border border-slate-200 p-6">
    <div *ngIf="isLoading" class="loading-state py-20 text-center">
      <app-logo-spinner [size]="64" [ripple]="false"></app-logo-spinner>
      <p>Loading configuration...</p>
    </div>

    <div *ngIf="!isLoading">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-2">Configuration JSON</label>
        <p class="text-xs text-slate-500 mb-2">Edit the organization configuration as a raw JSON string. Make sure to maintain the schema.</p>
        <textarea
          [(ngModel)]="configJson"
          class="w-full h-96 p-4 font-mono text-sm border rounded-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          spellcheck="false"
        ></textarea>
      </div>

      <div *ngIf="successMessage" class="mb-4 p-3 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="mb-4 p-3 bg-rose-50 text-rose-700 border border-rose-200 rounded">
        {{ errorMessage }}
      </div>

      <div class="flex justify-end">
        <button
          (click)="saveConfig()"
          [disabled]="isSaving"
          class="btn bg-indigo-500 hover:bg-indigo-600 text-white disabled:opacity-50"
        >
          <span *ngIf="!isSaving">Save Changes</span>
          <span *ngIf="isSaving">Saving...</span>
        </button>
      </div>
    </div>
  </div>
</div>
