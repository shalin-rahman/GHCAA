<section class="page-section animate-fade-in">
    <header class="page-header flex justify-between items-center"><div><h1>Elections</h1><p>Create and run the association election.</p></div><button class="btn btn-accent" (click)="showForm.set(!showForm())">{{ showForm() ? 'Close' : 'New election' }}</button></header>
    <div *ngIf="showForm()" class="glass-card stack gap-4">
        <div class="form-group"><label for="election-title">Title</label><input id="election-title" [(ngModel)]="form.title"></div>
        <div class="form-group"><label for="election-description">Description</label><textarea id="election-description" [(ngModel)]="form.description"></textarea></div>
        <div class="glass-card" *ngFor="let position of form.positions; let i = index">
            <div class="form-group"><label [for]="'position-' + i">Position</label><input [id]="'position-' + i" [(ngModel)]="position.title"></div>
            <div class="form-group"><label [for]="'seats-' + i">Seats</label><input [id]="'seats-' + i" type="number" min="1" [(ngModel)]="position.seats"></div>
            <button class="btn btn-secondary btn-sm" *ngIf="(form.positions?.length ?? 0) > 1" (click)="removePosition(i)">Remove position</button>
        </div>
        <div class="flex gap-2"><button class="btn btn-secondary" (click)="addPosition()">Add position</button><button class="btn btn-primary" [disabled]="saving()" (click)="create()">{{ saving() ? 'Saving...' : 'Create election' }}</button></div>
    </div>
    <app-search-bar placeholder="Search elections" (valueChange)="search.set($event)"></app-search-bar>
    <div *ngIf="loading()" class="empty-state"><app-logo-spinner [size]="48" [ripple]="false"></app-logo-spinner><p>Loading elections...</p></div>
    <div *ngIf="!loading() && filtered().length === 0" class="empty-state"><h2>No elections found</h2><p>Create an election to begin.</p></div>
    <div class="glass-card" *ngFor="let election of filtered()">
        <div class="flex justify-between items-center"><div><h2>{{ election.title }}</h2><p class="text-muted">{{ phaseLabel[election.phase] }} · {{ election.positions.length }} positions</p></div><div class="flex gap-2"><button class="btn btn-primary btn-sm" *ngIf="election.phase === 'Announced'" (click)="publish(election)">Publish</button><button class="btn btn-secondary btn-sm" *ngIf="election.phase === 'Polling'" (click)="close(election)">Close</button></div></div>
    </div>
</section>
