@if (isVisible()) {
<section id="gallery" class="gallery-section">
    <div class="container">
        <div class="section-header">
            <h2>Campus Moments</h2>
            <p>Capturing the essence of Haragangian life and legacy.</p>
            <div class="underline"></div>
        </div>

        <div class="gallery-grid">
            @for (album of albums(); track album.id) {
            @if (currentPhoto(album); as photo) {
            <div class="gallery-item glass-card" (click)="viewFull(photo.photoPath)">
                <img [src]="photo.photoPath" [alt]="album.title" appImgFallback="/assets/placeholders/image-placeholder.svg">
                <div class="gallery-overlay">
                    <span>{{ album.title }}</span>
                </div>
            </div>
            }
            }
        </div>

        <div class="section-footer">
            <a routerLink="/gallery" class="btn btn-accent">Visit Full Gallery</a>
        </div>
    </div>
</section>
}
