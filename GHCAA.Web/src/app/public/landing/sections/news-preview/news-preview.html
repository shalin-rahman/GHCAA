@if (isVisible()) {
<!-- Latest News -->
<section id="news" class="news-section">
    <div class="container">
        <div class="section-header">
            <h2>Latest Announcements</h2>
            <div class="underline"></div>
        </div>

        <!-- 55.4: compact feed-list, matching the member dashboard's "Latest News" widget design
             (dashboard.html .activity-feed/.feed-item) instead of the card-grid every other
             landing section uses — this was the specific ask, scoped to News only. -->
        <div class="news-feed-list">
            @for (item of news(); track item.id) {
            <a [routerLink]="['/portal/news', item.id]" class="news-feed-item">
                <div class="dot"></div>
                <div class="text">
                    <strong>{{ item.title }}</strong>
                    <p>{{ item.content }}</p>
                    <small>{{ item.createdAt | date:'dd-MM-yyyy' }}</small>
                </div>
                <span class="arrow">→</span>
            </a>
            }
        </div>
        <div class="section-footer text-center mt-12">
            <a routerLink="/portal/news" class="btn btn-accent px-12 py-3 rounded-full font-bold shadow-gold">All
                News</a>
        </div>
    </div>
</section>
}
