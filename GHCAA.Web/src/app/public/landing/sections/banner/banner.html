<section class="hero">
    <div class="hero-pattern"></div>
    <div class="container hero-content">
        <div class="hero-logo-box">
            <div class="logo-spinner-ring">
                <div class="spinner-arc"></div>
                <div class="spinner-arc spinner-arc--reverse"></div>
                <img src="/assets/logo.jpg" alt="GHCAA Official Seal" class="hero-seal">
            </div>
        </div>
        <h2 class="reveal-text">Reconnecting <span class="highlight">HARAGANGIAN</span></h2>
        <div class="reveal-subtitle">
            <div class="subtitle-pill px-10">
                Sharing Heritage, Aligning Lives, Integrating Networks
            </div>
        </div>
        <div class="hero-btns">
            <a routerLink="/register" class="btn btn-accent btn-lg">Join Association</a>
            <a href="/assets/GHCAA constitution 4.0.pdf" target="_blank"
                class="btn btn-accent btn-lg px-10 rounded-full font-bold shadow-gold">Read
                Constitution</a>
        </div>

        <div class="hero-stats" *ngIf="stats()">
            <div class="stat-item">
                <span class="stat-value">{{ stats().totalActiveMembers || 1200 }}+</span>
                <span class="stat-label">Total Members</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-value">{{ stats().publishedEvents || 50 }}+</span>
                <span class="stat-label">Events Hosted</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-value">{{ stats().alumniChapters || 12 }}+</span>
                <span class="stat-label">Global Chapters</span>
            </div>
        </div>
    </div>
    <div class="hero-overlay"></div>
</section>
