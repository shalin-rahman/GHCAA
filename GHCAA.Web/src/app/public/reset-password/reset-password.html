<div class="auth-container">
    <div class="auth-card glass-effect">
        <div class="auth-header">
            <img src="/assets/logo.png" alt="GHCAA" class="auth-logo">
            <h1>Reset Password</h1>
            <p class="text-muted">Enter your new secure password below.</p>
        </div>

        <div *ngIf="success()" class="status-msg success-box">
            <p>✅ Password reset successfully! You can now login with your new password.</p>
            <a routerLink="/login" class="btn btn-primary mt-4">Go to Login</a>
        </div>

        <form *ngIf="!success()" (submit)="onSubmit()" #resetForm="ngForm">
            <div *ngIf="error()" class="status-msg error-box">
                {{ error() }}
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="text" [value]="email" disabled class="form-control">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <div class="password-input">
                    <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" required 
                           placeholder="••••••••" class="form-control">
                    <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
                        <i class="fas" [ngClass]="showPassword() ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="password-input">
                    <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" required 
                           placeholder="••••••••" class="form-control">
                    <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
                        <i class="fas" [ngClass]="showPassword() ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full" [disabled]="loading() || !resetForm.valid">
                {{ loading() ? 'Resetting...' : 'Update Password' }}
            </button>

            <div class="auth-footer mt-4">
                <a routerLink="/login" class="back-link">Back to Login</a>
            </div>
        </form>
    </div>
</div>
