<section class="doc-hero">
    <div class="container hero-content">
        <div class="doc-badge">{{ orgConfigService.config()?.branding?.shortName }}</div>
        <h1>{{ block()?.title || fallbackTitle() }}</h1>
    </div>
</section>

<div class="container main-content">
    @if (loading()) {
    <app-loading-panel label="Loading…" [size]="64"></app-loading-panel>
    } @else if (block()) {
    <!-- Admin-managed content (Admin → Site Content, group "policy"). Server-sanitized on write. -->
    <article class="glass-card policy-card doc-prose" [innerHTML]="bodyHtml()"></article>
    } @else {
    <div class="glass-card policy-card empty-state">
        <h2>Not published yet</h2>
        <p>This page has no published text yet. Please check back later or use the Contact page.</p>
    </div>
    }
</div>
