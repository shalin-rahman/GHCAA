<div class="admin-wrapper" [class.sidebar-open]="isSidebarOpen()">
    <!-- 29F.4: backdrop closes the mobile drawer when tapped -->
    <div class="admin-backdrop" (click)="isSidebarOpen.set(false)"></div>
    <nav class="admin-sidebar">
        <div class="admin-brand">
            <img [src]="orgConfig.config()?.branding?.logoUrl || '/assets/logo.png'"
                [alt]="orgConfig.config()?.branding?.shortName || 'Logo'" class="logo"
                appImgFallback="/assets/logo.png">
            <div class="brand-text">
                <span class="brand-name">{{ orgConfig.config()?.branding?.shortName || 'Admin' }} Admin</span>
                <span class="brand-sub">Control Panel</span>
            </div>
        </div>

        <div class="nav-body">
            @for (section of nav.adminNavSections(); track section.name) {
            <div class="nav-section">
                <span class="nav-section-label">{{ section.name }}</span>
                @for (item of section.items; track item.path) {
                <a [routerLink]="item.path" routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: item.path === '/admin/dashboard' || item.path === '/admin/members' || item.path === '/admin/payments'}"
                    class="nav-item">
                    <span class="nav-icon"><app-icon [name]="item.icon"></app-icon></span>
                    <span class="nav-label">{{ item.label }}</span>
                </a>
                }
            </div>
            }
        </div>

        <div class="nav-footer">
            <!-- Sign Out + user identity live in the top-right header only (no duplication). -->
            <a routerLink="/portal/dashboard" class="nav-item exit-item">
                <span class="nav-icon"><app-icon name="back"></app-icon></span>
                <span class="nav-label">Member Portal</span>
            </a>
        </div>
    </nav>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-inner portal-content">
                <!-- 29F.4: hamburger toggles the sidebar drawer on mobile -->
                <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle menu"><app-icon name="menu"></app-icon></button>
                <app-breadcrumb [root]="(orgConfig.config()?.branding?.shortName || 'Admin') + ' Admin'"
                    [current]="currentPageTitle()"></app-breadcrumb>
                <div class="header-right">
                    <a routerLink="/portal/dashboard" class="header-btn">Exit Admin</a>
                    <app-user-menu [roleLabel]="auth.currentUser()?.role ?? ''"></app-user-menu>
                </div>
            </div>
        </header>
        <div class="admin-content portal-content">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
