@let activeTheme = themeService.activeSpecialTheme();

<nav class="glass-nav" [style.background-color]="activeTheme ? activeTheme.backgroundColor : ''"
    [style.color]="activeTheme ? activeTheme.textColor : ''" [class.special-day]="activeTheme">
    <div class="container nav-content">
        <div class="logo">
            <img src="/assets/logo.jpg" alt="GHC" class="mini-logo">
            <div class="logo-text">
                <span class="abbr">GHCAA</span>
                <span class="full hide-mobile">Govt. Haraganga College Alumni Association</span>
            </div>
        </div>

        <!-- Middle Announcement Text -->
        @if (activeTheme) {
        <div class="nav-announcement">
            {{ activeTheme.announcementText }}
        </div>
        }

        <div class="nav-links hide-mobile">
            <a routerLink="/" class="nav-link" [style.color]="activeTheme ? activeTheme.textColor : ''">Home</a>
            <a routerLink="/about" class="nav-link" [style.color]="activeTheme ? activeTheme.textColor : ''">About
                Us</a>
            <a routerLink="/register" class="nav-link" [style.color]="activeTheme ? activeTheme.textColor : ''">Join</a>
            <a routerLink="/gallery" class="nav-link"
                [style.color]="activeTheme ? activeTheme.textColor : ''">Gallery</a>
            <a routerLink="/contact" class="nav-link"
                [style.color]="activeTheme ? activeTheme.textColor : ''">Contact</a>
            <a routerLink="/login" class="btn btn-accent"
                [style.background-color]="activeTheme ? activeTheme.textColor : ''"
                [style.color]="activeTheme ? activeTheme.backgroundColor : ''">Member Login</a>
        </div>
    </div>
</nav>

<main>
    <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
