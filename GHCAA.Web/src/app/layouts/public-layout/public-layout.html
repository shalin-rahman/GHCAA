
@let activeTheme = themeService.activeSpecialTheme();

@if (activeTheme) {
<div class="top-announcement-banner"
    [style.background]="activeTheme.enableGradientFading
        ? 'linear-gradient(135deg, ' + activeTheme.backgroundColor + ', ' + (activeTheme.sidebarColor || activeTheme.backgroundColor) + ')'
        : activeTheme.backgroundColor"
    [style.color]="activeTheme.textColor">
    <div class="container banner-content">
        @if (activeTheme.imageUrl) {
            <img [src]="activeTheme.imageUrl" alt="Special Day Banner" class="banner-image">
        } @else {
            <span class="banner-text"
                [class.anim-fade]="activeTheme.animationStyle === 'Fade'"
                [class.anim-typewriter]="activeTheme.animationStyle === 'Typewriter'"
                [class.anim-flip3d]="activeTheme.animationStyle === '3D'"
                [class.anim-scroll]="activeTheme.animationStyle === 'Scroll'">
                {{ displayedText || activeTheme.announcementText }}
            </span>
        }
    </div>
</div>
}

<nav class="glass-nav" [class.with-banner]="activeTheme">
    <div class="container nav-content">
        <div class="logo">
            <img src="/assets/logo.jpg" alt="GHC" class="mini-logo">
            <div class="logo-text">
                <span class="abbr">GHCAA</span>
                <span class="full hide-mobile hidden md:block">Govt. Haraganga College Alumni Association</span>
            </div>
        </div>

        <button class="mobile-toggle z-50 p-2" (click)="toggleMobileMenu()" aria-label="Toggle Menu">
            <div class="hamburger-box">
                <span class="hamburger-inner" [class.active]="isMobileMenuOpen"></span>
            </div>
        </button>

        <div class="nav-links" 
             [class.active]="isMobileMenuOpen">
            <a routerLink="/" class="nav-link">Home</a>
            <a routerLink="/about" class="nav-link">About</a>
            <a routerLink="/events" class="nav-link">Events</a>
            <a routerLink="/news" class="nav-link" title="Latest News">News</a>
            <a routerLink="/gallery" class="nav-link">Gallery</a>
            <a routerLink="/contact" class="nav-link">Contact</a>
            <a routerLink="/login" class="nav-link">Login</a>
        </div>
    </div>
</nav>

<main>
    <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
