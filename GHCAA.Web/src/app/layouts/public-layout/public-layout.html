@let activeTheme = themeService.activeSpecialTheme();

@if (activeTheme) {
<div class="top-announcement-banner" [style.background-color]="activeTheme.backgroundColor"
    [style.color]="activeTheme.textColor">
    <div class="container banner-content">
        <span class="banner-text">{{ activeTheme.announcementText }}</span>
    </div>
</div>
}

<nav class="glass-nav" [class.with-banner]="activeTheme">
    <div class="container nav-content">
        <div class="logo">
            <img src="/assets/logo.jpg" alt="GHC" class="mini-logo">
            <div class="logo-text">
                <span class="abbr">GHCAA</span>
                <span class="full hide-mobile hidden md:block">Govt. Haraganga College Alumni Association</span>
            </div>
        </div>

        <button class="mobile-toggle block md:hidden z-50 p-2" (click)="toggleMobileMenu()">
            <span class="block w-6 h-0.5 bg-white mb-1.5 transition-transform" [class.rotate-45]="isMobileMenuOpen" [class.translate-y-2]="isMobileMenuOpen"></span>
            <span class="block w-6 h-0.5 bg-white mb-1.5 transition-opacity" [class.opacity-0]="isMobileMenuOpen"></span>
            <span class="block w-6 h-0.5 bg-white transition-transform" [class.-rotate-45]="isMobileMenuOpen" [class.-translate-y-2]="isMobileMenuOpen"></span>
        </button>

        <div class="nav-links flex-col md:flex-row absolute md:relative top-full left-0 w-full md:w-auto bg-black/95 md:bg-transparent p-6 md:p-0 border-b md:border-0 border-white/10 transition-all duration-300 md:flex items-center gap-4 lg:gap-8" 
             [class.hidden]="!isMobileMenuOpen" [class.flex]="isMobileMenuOpen">
            <a routerLink="/" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">Home</a>
            <a routerLink="/about" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">About</a>
            <a routerLink="/events" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">Events</a>
            <a routerLink="/news" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left" title="Latest News">News</a>
            <a routerLink="/register" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">Join</a>
            <a routerLink="/gallery" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">Gallery</a>
            <a routerLink="/contact" class="nav-link block py-2 md:py-0 w-full md:w-auto text-center md:text-left">Contact</a>
            <a routerLink="/login" class="btn btn-accent block w-full md:w-auto text-center mt-4 md:mt-0">Login</a>
        </div>
    </div>
</nav>

<main>
    <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
