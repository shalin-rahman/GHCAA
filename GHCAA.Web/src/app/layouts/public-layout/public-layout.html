@let activeTheme = themeService.activeSpecialTheme();

@if (activeTheme) {
<div class="top-announcement-banner" [style.background-color]="activeTheme.backgroundColor"
    [style.color]="activeTheme.textColor">
    <div class="container banner-content">
        <span class="banner-text">{{ activeTheme.announcementText }}</span>
    </div>
</div>
}

<nav class="glass-nav" [class.with-banner]="activeTheme">
    <div class="container nav-content">
        <div class="logo">
            <img src="/assets/logo.jpg" alt="GHC" class="mini-logo">
            <div class="logo-text">
                <span class="abbr">GHCAA</span>
                <span class="full hide-mobile">Govt. Haraganga College Alumni Association</span>
            </div>
        </div>

        <div class="nav-links hide-mobile">
            <a routerLink="/" class="nav-link">Home</a>
            <a routerLink="/about" class="nav-link">About</a>
            <a routerLink="/events" class="nav-link">Events</a>
            <a routerLink="/news" class="nav-link" title="Latest News">News</a>
            <a routerLink="/register" class="nav-link">Join</a>
            <a routerLink="/gallery" class="nav-link">Gallery</a>
            <a routerLink="/contact" class="nav-link">Contact</a>
            <a routerLink="/login" class="btn btn-accent">Login</a>
        </div>
    </div>
</nav>

<main>
    <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
