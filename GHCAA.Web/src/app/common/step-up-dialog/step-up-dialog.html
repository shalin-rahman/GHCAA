@if (stepUp.isOpen()) {
<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="step-up-title">
    <div class="modal-box step-up-box">
        <app-modal-header title="Confirm it's you" headingId="step-up-title" closeLabel="Cancel verification" (closed)="stepUp.cancel()"></app-modal-header>

        <div class="modal-body">
            <p class="text-main">This action is protected. Enter the 6-digit code from your email to continue.</p>

            @if (stepUp.sending()) {
            <p class="step-up-info">Sending a code…</p>
            } @else if (stepUp.infoMessage(); as info) {
            <p class="step-up-info">{{ info }}</p>
            }

            @if (stepUp.errorMessage(); as err) {
            <p class="step-up-error" role="alert">{{ err }}</p>
            }

            <div class="form-group">
                <label for="stepUpCode">Verification code</label>
                <input id="stepUpCode" type="text" inputmode="numeric" autocomplete="one-time-code"
                    maxlength="6" placeholder="000000" [value]="code" (input)="code = $any($event.target).value" name="stepUpCode"
                    (keyup.enter)="submit()" [disabled]="stepUp.verifying()" />
            </div>

            <button type="button" class="btn btn-outline btn-sm" (click)="stepUp.requestCode()"
                [disabled]="stepUp.sending() || stepUp.verifying()">
                {{ stepUp.sending() ? 'Sending…' : 'Resend code' }}
            </button>
        </div>

        <div class="modal-footer step-up-actions">
            <button type="button" class="btn btn-primary" (click)="submit()"
                [disabled]="!isCodeValid() || stepUp.verifying()">
                {{ stepUp.verifying() ? 'Verifying…' : 'Verify and continue' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="stepUp.cancel()"
                [disabled]="stepUp.verifying()">Cancel</button>
        </div>
    </div>
</div>
}
