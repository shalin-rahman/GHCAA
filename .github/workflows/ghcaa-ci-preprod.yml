name: GHCAA Preprod CI/CD

on:
  push:
    branches: [ preprod ]
  pull_request:
    branches: [ preprod ]
  workflow_dispatch:

jobs:
  lint-backend:
    name: Backend Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Verify Formatting
        run: dotnet format --verify-no-changes

  lint-frontend:
    name: Frontend Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: GHCAA.Web
        run: npm ci
      - name: Type Check
        working-directory: GHCAA.Web
        run: npm run type-check

  lint-mobile:
    name: Mobile Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Analyze Code
        working-directory: GHCAA.Mobile
        run: flutter analyze

  api-tests:
    name: API/Backend Tests
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Run Tests
        run: dotnet test GHCAA.Tests/GHCAA.Tests.csproj --configuration Release --no-restore

  ui-tests:
    name: Web UI/Frontend Tests
    needs: [api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: GHCAA.Web
        run: npm ci

      - name: Run Unit Tests
        working-directory: GHCAA.Web
        run: npm run test:unit -- --run

      - name: Build Check
        working-directory: GHCAA.Web
        run: npm run build

  mobile-tests:
    name: Mobile/Flutter Tests
    needs: [ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: GHCAA.Mobile
        run: flutter pub get

      - name: Run Tests
        working-directory: GHCAA.Mobile
        run: flutter test

  integrated-build:
    name: Preprod Integrated Build
    needs: [mobile-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Restore & Build API
        run: |
          dotnet restore
          dotnet build -c Release
          
      - name: Build Web Frontend
        working-directory: GHCAA.Web
        run: |
          npm ci
          npm run build
          
      - name: Integrated Packaging
        run: |
          dotnet publish GHCAA.API/GHCAA.API.csproj -c Release -o ./publish/api
          mkdir -p ./publish/api/wwwroot
          cp -r GHCAA.Web/dist/GHCAA.Web/browser/* ./publish/api/wwwroot/

      - name: Archive Integrated Build
        uses: actions/upload-artifact@v4
        with:
          name: ghcaa-preprod-deployment
          path: ./publish/api
