name: GHCAA Standard CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  lint-backend:
    name: Backend Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Verify Formatting
        run: dotnet format --verify-no-changes
      # 82.26: two cheap commands catch what 48.9/48.17 (a stale xlsx, Angular CVEs) had to be
      # found by hand. `dotnet list package --vulnerable` exits 0 even when it finds one, so grep
      # its own report text instead of trusting the exit code.
      - name: Check for vulnerable NuGet packages
        run: |
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable package(s) found."
            exit 1
          fi

  lint-frontend:
    name: Frontend Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install
        working-directory: GHCAA.Web
        run: npm ci
      - name: Type Check
        working-directory: GHCAA.Web
        run: npm run type-check
      # 82.26: fail the build on a known-vulnerable dependency instead of finding it by hand.
      - name: Audit npm packages
        working-directory: GHCAA.Web
        run: npm audit --audit-level=high

  lint-mobile:
    name: Mobile Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Analyze Code
        working-directory: GHCAA.Mobile
        run: flutter analyze

  api-tests:
    name: API/Backend Tests
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore Dependencies
        run: dotnet restore

      # 82.50: --collect/--settings folded into the one test run instead of a second `dotnet test`,
      # so coverage costs nothing extra. --settings excludes Migrations/bin/obj (see
      # GHCAA.Tests/coverlet.runsettings) so the percentage isn't diluted by generated code.
      - name: Build and Run Tests
        run: >
          dotnet test GHCAA.Tests/GHCAA.Tests.csproj --configuration Release --no-restore
          --collect:"XPlat Code Coverage" --settings GHCAA.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.11

      # ReportGenerator's own Html report already gives a searchable/filterable class list,
      # click-to-sort columns, and a per-class drill-down with line-by-line coverage highlighting —
      # exactly what 82.50 asked for, with no dashboard of our own to build or maintain.
      - name: Generate Coverage Report
        run: >
          reportgenerator "-reports:coverage/**/coverage.cobertura.xml"
          "-targetdir:coverage-report" -reporttypes:Html

      # Published as a build artifact, not GitHub Pages: it's regenerated on every relevant run
      # (no stale-snapshot risk), and an artifact needs no extra hosting setup.
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 30

  api-contract:
    name: API Contract (Swagger snapshot)
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Build API (Release)
        run: dotnet build GHCAA.API/GHCAA.API.csproj -c Release

      - name: Restore Swagger CLI tool
        working-directory: GHCAA.API
        run: dotnet tool restore

      # 82.10a: the interactive Swagger UI only serves in Development (see Program.cs) — never on
      # a live host, so it can't hand an attacker a request-firing form for the whole API. This
      # step produces the same contract as a build artefact instead: no runtime surface, but a
      # reviewer still sees a diff the moment a field is renamed or a route disappears.
      - name: Generate current swagger.json
        working-directory: GHCAA.API
        run: dotnet tool run swagger tofile --output /tmp/swagger.generated.json bin/Release/net9/GHCAA.API.dll v1

      - name: Compare against committed snapshot
        run: python3 docs/api/diff_swagger.py docs/api/swagger.json /tmp/swagger.generated.json

  ui-tests:
    name: Web UI/Frontend Tests
    needs: [api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: GHCAA.Web
        run: npm ci

      - name: Run Unit Tests
        working-directory: GHCAA.Web
        run: npm run test:unit -- --run

      - name: Collect Web Coverage
        working-directory: GHCAA.Web
        run: npm run test:coverage

      - name: Upload Web Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: GHCAA.Web/coverage
          retention-days: 30

      - name: Build Check
        working-directory: GHCAA.Web
        run: npm run build

  e2e-tests:
    name: End-to-End (Playwright)
    needs: [ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: GHCAA.Web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: GHCAA.Web
        run: npx playwright install --with-deps chromium

      # 82.23: playwright.config.ts boots both the API and the Angular dev server itself and
      # polls /healthz, so this job needs no separate "start the app" step.
      - name: Run Playwright E2E Suite
        working-directory: GHCAA.Web
        run: npm run test:e2e

  mobile-tests:
    name: Mobile/Flutter Tests
    needs: [ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: GHCAA.Mobile
        run: flutter pub get

      - name: Run Tests
        working-directory: GHCAA.Mobile
        run: flutter test --coverage --exclude-tags golden --reporter expanded

      # 82.53b: genhtml turns the raw lcov.info into the same kind of browsable,
      # per-file drill-down report ReportGenerator already gives the .NET job.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate Coverage Report
        working-directory: GHCAA.Mobile
        run: genhtml coverage/lcov.info -o coverage/html

      - name: Upload Mobile Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: GHCAA.Mobile/coverage
          retention-days: 30

  integrated-build:
    name: Production-Grade Build
    needs: [mobile-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      
      - name: Restore & Build API
        run: |
          dotnet restore
          dotnet build -c Release
          
      - name: Build Web Frontend
        working-directory: GHCAA.Web
        run: |
          npm ci
          npm run build
          
      - name: Integrated Packaging
        run: |
          dotnet publish GHCAA.API/GHCAA.API.csproj -c Release -o ./publish/api
          mkdir -p ./publish/api/wwwroot
          cp -r GHCAA.Web/dist/GHCAA.Web/browser/* ./publish/api/wwwroot/

      # No artifact upload here on purpose — nothing downloaded it, and it competed for
      # the account artifact-storage quota with the release artifacts that ARE consumed.
      # The job still proves the integrated package builds; that is its whole value.
