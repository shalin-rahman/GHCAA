name: Haragangian Mobile Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 82.25: a tag pushed by hand, or at a commit that never went through CI, used to go straight
  # to a store release with no test gate — the one target that can't be hot-fixed if it's broken.
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
        working-directory: GHCAA.Mobile
      - name: Run Tests
        run: flutter test --exclude-tags golden --reporter expanded
        working-directory: GHCAA.Mobile

  build-android:
    name: Build Android
    needs: [test]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
        working-directory: GHCAA.Mobile
      - name: Build AAB
        # 7.16: --obfuscate strips/renames Dart symbols in the shipped binary; --split-debug-info
        # writes the symbol map that build needed to reverse a stack trace back to source, so it
        # has to be archived here rather than thrown away, or a crash report from this exact build
        # can never be symbolicated again.
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info
        working-directory: GHCAA.Mobile
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: GHCAA.Mobile/build/app/outputs/bundle/release/app-release.aab
          # Consumed by `create-release` in this same run; the GitHub Release is the
          # durable copy and release assets do not count against the artifact quota.
          retention-days: 1
      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: GHCAA.Mobile/build/debug-info
          # Keep these longer than the .aab: they're the only way to symbolicate a crash report
          # for this build later. Not consumed by another job in this run, so no 1-day trim.
          retention-days: 90
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.ghcaa.portal
          releaseFiles: GHCAA.Mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal

  build-ios:
    name: Build iOS
    needs: [test]
    runs-on: macos-latest
    env:
      CERTIFICATE_BASE64: ${{ secrets.IOS_P12_CERTIFICATE }}
      PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
      APP_STORE_API_KEY_P8: ${{ secrets.APP_STORE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
      - name: Install Dependencies
        run: flutter pub get
        working-directory: GHCAA.Mobile
      - name: Build IPA
        # 7.16: same obfuscation/debug-info split as the Android build above.
        run: flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist --obfuscate --split-debug-info=build/debug-info
        working-directory: GHCAA.Mobile
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: GHCAA.Mobile/build/ios/ipa/*.ipa
          # Consumed by `create-release` in this same run; the GitHub Release is the
          # durable copy and release assets do not count against the artifact quota.
          retention-days: 1
      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-info
          path: GHCAA.Mobile/build/debug-info
          # Keep these longer than the .ipa: they're the only way to symbolicate a crash report
          # for this build later. Not consumed by another job in this run, so no 1-day trim.
          retention-days: 90
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: GHCAA.Mobile/build/ios/ipa/*.ipa
          issuer-id: ${{ env.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ env.APP_STORE_API_KEY_ID }}
          api-private-key: ${{ env.APP_STORE_API_KEY_P8 }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - uses: actions/checkout@v5
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.aab
            *.ipa
          draft: true
          generate_release_notes: true
