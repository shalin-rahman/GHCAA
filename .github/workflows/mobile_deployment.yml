name: Haragangian Mobile Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
        working-directory: GHCAA.Mobile
      - name: Build AAB
        run: flutter build appbundle --release
        working-directory: GHCAA.Mobile
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: GHCAA.Mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.ghcaa.portal
          releaseFiles: GHCAA.Mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      CERTIFICATE_BASE64: ${{ secrets.IOS_P12_CERTIFICATE }}
      PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
      APP_STORE_API_KEY_P8: ${{ secrets.APP_STORE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
      - name: Install Dependencies
        run: flutter pub get
        working-directory: GHCAA.Mobile
      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist
        working-directory: GHCAA.Mobile
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: GHCAA.Mobile/build/ios/ipa/*.ipa
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: GHCAA.Mobile/build/ios/ipa/*.ipa
          issuer-id: ${{ env.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ env.APP_STORE_API_KEY_ID }}
          api-private-key: ${{ env.APP_STORE_API_KEY_P8 }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - uses: actions/checkout@v5
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.aab
            *.ipa
          draft: true
          generate_release_notes: true
