version: 2

# Updates open against preprod, which is the branch CI and the Render deploy hook
# both watch. Weekly rather than daily, and capped, because one maintainer reviews
# every one of these by hand.
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: npm
    directory: "/GHCAA.Web"
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"

  - package-ecosystem: pub
    directory: "/GHCAA.Mobile"
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, mobile]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: preprod
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: "/"
    target-branch: preprod
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, deployment]
