  - generic [ref=e159]:
    - heading "Decisions, 2026-10-20" [level=2] [ref=e160]
    - list [ref=e161]:
      - listitem [ref=e162]: Numbering. Regulations numbers ER-01 to ER-35, with a letter suffix for the 15 template-only forms (table above).
      - listitem [ref=e163]: Old codes. The 16 codes printed before this change still open the right form (table above).
      - listitem [ref=e164]: "ER-01 and ER-02 dates. Stored on the election: announced on, nomination opens and closes, scrutiny, withdrawal deadline, final list date, polling opens and closes, campaign opens and closes, silence period, venue, notice reference number and recount window end."
      - listitem [ref=e165]: "Recount. One stored record per filing holds the request and the decision: seat, applicant, grounds, received time, decision, reason and who decided. ER-28 prints the request, ER-28A the decision, and ER-28B compares the original count with the recount."
      - listitem [ref=e166]: Handover. Moves to ER-34 with the 15-item checklist from template 07, and each tick is stored. ER-33 is the Election Completion Report, as in the Regulations.
      - listitem [ref=e167]: "ER-17 scrutiny ticks. Seven ticks stored on each nomination: membership verified, voting member, minimum period, founding requirement, documents complete, fee paid, declaration signed. Any commissioner may tick, and the sheet prints who ticked and when."
      - listitem [ref=e168]: "Title-only matches. All six pairs are one form: ER-08 with 05 ER-07, ER-17 with 05 ER-11, ER-27 with 07 ER-23, ER-29 with 07 ER-30, ER-31 with 07 ER-34, ER-32 with 07 ER-35."
      - listitem [ref=e169]: Signers. ER-03 is signed by the Selection Committee chair and one member. ER-20 stays a separate form from the Code of Conduct acceptance ECC-01.
      - listitem [ref=e170]: ER-13. Reuses the ER-05 neutrality text plus the lines on not holding political office. Candidates sign ER-13; officials sign ER-05.
      - listitem [ref=e171]: Layouts. Approved as shown below.
      - listitem [ref=e172]: Vote receipt. Made on the server as a PDF with Bengali text. It prints the receipt code, the election and the time, and never the choices.
      - listitem [ref=e173]: Build order. ER-04, ER-05, ER-23 and ER-24 are built first, because their data is already stored. The stored fields above come with a migration that waits for the preprod migration gate.
