name: ghcaa_mobile
description: "GHCAA Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.6
  webview_flutter: ^4.7.0
  image_picker: ^1.1.2
  local_auth: ^2.2.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  pdf: ^3.10.8
  printing: ^5.11.1
  package_info_plus: ^8.1.0
  device_info_plus: ^10.1.0
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.1
  flutter_spinkit: ^5.2.1
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  sentry_flutter: ^8.4.0
  cached_network_image: ^3.3.1
  signalr_netcore: ^1.3.5
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#0B0E0F"
  image: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    color: "#0B0E0F"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
