name: ghcaa_mobile
# Dart package name, unrelated to the platform bundle id/applicationId.
# Renaming it would touch every `package:ghcaa_mobile/...` import in the repo,
# so it's left alone here — out of scope for the profile-pack swap.
description: "Alumni association mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.11.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.2.6
  webview_flutter: ^4.14.1
  image_picker: ^1.2.3
  local_auth: ^2.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^8.1.0
  device_info_plus: ^10.1.0
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  shimmer: ^3.0.0
  flutter_animate: ^4.5.1
  flutter_spinkit: ^5.2.1
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  sentry_flutter: ^8.4.0
  cached_network_image: ^3.3.1
  signalr_netcore: ^1.3.5
  intl: ^0.20.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.2.0
  connectivity_plus: ^6.0.3
  screen_protector: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.15.1
  golden_toolkit: ^0.15.0
  # Already resolved transitively via path_provider; declared directly so
  # file_service_test.dart can swap PathProviderPlatform.instance for a fake.
  path_provider_platform_interface: ^2.1.3
  integration_test:
    sdk: flutter

# Base icon/splash config — matches the GHC profile pack's assets, so it's
# what a plain `dart run flutter_launcher_icons` / `flutter_native_splash:create`
# still produces. tool/apply_profile.dart generates a per-profile
# flutter_launcher_icons-<name>.yaml / flutter_native_splash-<name>.yaml pair
# from profiles/<name>/assets when building a different institution's flavor.
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#0B0E0F"
  image: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    color: "#0B0E0F"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
